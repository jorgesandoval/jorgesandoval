<svg viewBox="0 0 900 360" width="900" height="360" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', Courier, monospace">
  <defs>
    <pattern id="scan2" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff" opacity="0.02"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="360" rx="18" fill="#1a1d29"/>
  <rect x="10" y="10" width="880" height="340" rx="12" fill="#0b0f1a" stroke="#2b3350" stroke-width="2"/>

  <text x="450" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#f0b429" letter-spacing="6">CHARACTER ATTRIBUTES</text>

  <!-- INT -->
  <g>
    <text x="50" y="100" font-size="16" font-weight="bold" fill="#3ddbd9">INT</text>
    <text x="105" y="100" font-size="15" fill="#c3cae0">Machine Learning &amp; LLMs</text>
    <rect x="400" y="86" width="420" height="16" rx="8" fill="#1c2335"/>
    <rect x="400" y="86" width="0" height="16" rx="8" fill="#3ddbd9">
      <animate attributeName="width" from="0" to="399" begin="0.3s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="838" y="100" font-size="15" font-weight="bold" fill="#3ddbd9" text-anchor="end">95</text>
  </g>

  <!-- WIS -->
  <g>
    <text x="50" y="142" font-size="16" font-weight="bold" fill="#f0b429">WIS</text>
    <text x="105" y="142" font-size="15" fill="#c3cae0">Databases &amp; Data Engineering</text>
    <rect x="400" y="128" width="420" height="16" rx="8" fill="#1c2335"/>
    <rect x="400" y="128" width="0" height="16" rx="8" fill="#f0b429">
      <animate attributeName="width" from="0" to="386" begin="0.5s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="838" y="142" font-size="15" font-weight="bold" fill="#f0b429" text-anchor="end">92</text>
  </g>

  <!-- DEX -->
  <g>
    <text x="50" y="184" font-size="16" font-weight="bold" fill="#42be65">DEX</text>
    <text x="105" y="184" font-size="15" fill="#c3cae0">Python &amp; PyTorch</text>
    <rect x="400" y="170" width="420" height="16" rx="8" fill="#1c2335"/>
    <rect x="400" y="170" width="0" height="16" rx="8" fill="#42be65">
      <animate attributeName="width" from="0" to="395" begin="0.7s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="838" y="184" font-size="15" font-weight="bold" fill="#42be65" text-anchor="end">94</text>
  </g>

  <!-- STA -->
  <g>
    <text x="50" y="226" font-size="16" font-weight="bold" fill="#ff7eb6">STA</text>
    <text x="105" y="226" font-size="15" fill="#c3cae0">MLOps, Cloud &amp; Production Systems</text>
    <rect x="400" y="212" width="420" height="16" rx="8" fill="#1c2335"/>
    <rect x="400" y="212" width="0" height="16" rx="8" fill="#ff7eb6">
      <animate attributeName="width" from="0" to="370" begin="0.9s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="838" y="226" font-size="15" font-weight="bold" fill="#ff7eb6" text-anchor="end">88</text>
  </g>

  <!-- CHA -->
  <g>
    <text x="50" y="268" font-size="16" font-weight="bold" fill="#a78bfa">CHA</text>
    <text x="105" y="268" font-size="15" fill="#c3cae0">Teaching, Leadership &amp; Consulting</text>
    <rect x="400" y="254" width="420" height="16" rx="8" fill="#1c2335"/>
