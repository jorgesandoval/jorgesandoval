  <g>
    <text x="50" y="310" font-size="16" font-weight="bold" fill="#ff8a4c">LCK</text>
    <text x="105" y="310" font-size="15" fill="#c3cae0">Time-Series Forecasting</text>
    <rect x="400" y="296" width="420" height="16" rx="8" fill="#1c2335"/>
    <rect x="400" y="296" width="0" height="16" rx="8" fill="#ff8a4c">
      <animate attributeName="width" from="0" to="382" begin="1.3s" dur="1.2s" fill="freeze"/>
    </rect>
    <text x="838" y="310" font-size="15" font-weight="bold" fill="#ff8a4c" text-anchor="end">91</text>
